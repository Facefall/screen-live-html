<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>配置键预览 · 羽毛球 v3 · screen-live-html</title>
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="stage preview-sheet">
    <header class="preview-header">
      <p class="kicker">PREVIEW · V3</p>
      <h1 class="display-1 preview-title">羽毛球 v3 配置键一览</h1>
      <p class="preview-lede">
        数据源与 <code class="mono-inline">badminton_v3.html</code> 一致：<code class="mono-inline">/events/v3</code> SSE；
        <strong>文案</strong>与<strong>图片路径</strong>写入 <code class="mono-inline">config/display_v3.json</code>。
        copy / images 旁的说明来自 <code class="mono-inline">config/display-copy-labels-v3.json</code>。
      </p>
      <p class="preview-actions">
        <a class="preview-nav" href="/badminton_v3.html">羽毛球大屏 v3</a>
        <a class="preview-nav" href="/badminton_v2.html">羽毛球大屏 v2</a>
        <a class="preview-nav" href="/preview_v2.html">配置预览 v2</a>
        <a class="preview-link-back" href="/">← 返回大屏</a>
      </p>
    </header>

    <div class="preview-columns" id="preview-columns">
      <section class="card preview-block preview-block--copy" aria-labelledby="copy-heading">
        <h2 id="copy-heading">文案 · <span class="accent">copy</span></h2>
        <p class="preview-count" id="preview-copy-count"></p>
        <div id="preview-copy-keys" class="preview-keys-root"></div>
      </section>

      <section class="card preview-block preview-block--images" aria-labelledby="images-heading">
        <h2 id="images-heading">图片 · <span class="accent">images</span></h2>
        <p class="preview-count" id="preview-img-count"></p>
        <div id="preview-img-keys" class="preview-keys-root"></div>
        <p class="preview-save-wrap">
          <button type="button" class="preview-save-btn" id="preview-save-images">
            保存图片路径（images）
          </button>
        </p>
      </section>
    </div>

    <div class="preview-copy-save-dock" aria-label="文案重置与保存">
      <div class="preview-copy-save-dock-inner">
        <button type="button" class="preview-reset-btn" id="preview-reset">
          重置输入（恢复上次快照）
        </button>
        <button type="button" class="preview-save-btn" id="preview-save-copy">
          保存文案（copy）
        </button>
      </div>
    </div>

    <footer class="preview-footer">
      <span id="preview-status" class="live-chip" data-mode="loading" aria-live="polite">
        连接中…
      </span>
      <span class="preview-updated muted" id="preview-updated" hidden></span>
    </footer>
  </main>
  <script src="/preview_v3.js" defer></script>
</body>

</html>
