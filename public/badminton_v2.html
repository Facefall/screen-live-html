<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>羽毛球直播大屏2222</title>
    <link rel="stylesheet" href="/badminton_v2.css" />
</head>

<body class="badminton-page">
    <div class="root">
        <div>
            <div class="court-sidebar__matches" data-live-bg="badminton_img_sidebar">
                <article class="court-sidebar__match court-sidebar__match-first" aria-label="赛事预告第一场">
                    <header class="court-sidebar__match-head">
                        <div>
                            <span class="court-sidebar__meta" data-live-text="badminton_match1_meta">男双</span>
                            <span class="match_time" data-live-text="badminton_match1_match_time">约 20:30 开始</span>
                        </div>
                    </header>
                    <div class="court-sidebar__pair-names">
                        <span class="court-sidebar__names court-sidebar__names--home"
                            data-live-text="badminton_match1_a">谢志羿 / 向羽</span>
                        <span class="court-sidebar__vs-gap" aria-hidden="true"> vs </span>
                        <span class="court-sidebar__names court-sidebar__names--away"
                            data-live-text="badminton_match1_b">严雅伦 / 贾荷宇</span>
                    </div>
                    <footer class="court-sidebar__match-foot">
                        <!-- <div class="match_score_default" data-live-text="badminton_match1_default"></div> -->
                        <div class="match_score" data-live-text="badminton_match1_score1">12:21</div>
                        <div class="match_score match_score_match1" data-live-text="badminton_match1_score2">21:18</div>
                        <div class="match_score" data-live-text-opt data-live-text="badminton_match1_score3">18:21</div>
                    </footer>
                </article>

                <article class="court-sidebar__match court-sidebar__match-second" aria-label="赛事预告第二场">
                    <header class="court-sidebar__match-head">
                        <div>
                            <span class="court-sidebar__meta" data-live-text="badminton_match2_meta">男双</span>
                            <span class="match_time" data-live-text="badminton_match1_match_time">约 23:33 开始</span>
                        </div>
                    </header>
                    <div class="court-sidebar__pair-names">
                        <span class="court-sidebar__names court-sidebar__names--home"
                            data-live-text="badminton_match2_a">谢志羿 / 向羽</span>
                        <span class="court-sidebar__vs-gap" aria-hidden="true">vs
                        </span>
                        <span class="court-sidebar__names court-sidebar__names--away"
                            data-live-text="badminton_match2_b">严雅伦 / 贾荷宇</span>
                    </div>
                    <footer class="court-sidebar__match-foot">
                        <!-- <div class="match_score_default" data-live-text="badminton_match2_default"></div> -->
                        <div class="match_score" data-live-text="badminton_match2_score1">21:18</div>
                        <div class="match_score" data-live-text="badminton_match2_score2">21:18</div>
                        <div class="match_score" data-live-text-opt data-live-text="badminton_match2_score3" hidden>
                        </div>
                    </footer>
                </article>

                <article class="court-sidebar__match court-sidebar__match-third" aria-label="赛事预告第三场">
                    <header class="court-sidebar__match-head">
                        <div>
                            <span class="court-sidebar__meta" data-live-text="badminton_match3_meta">男双</span>
                            <span class="match_time" data-live-text="badminton_match1_match_time">约 23:33 开始</span>
                        </div>
                    </header>
                    <div class="court-sidebar__pair-names">
                        <span class="court-sidebar__names court-sidebar__names--home"
                            data-live-text="badminton_match3_a">谢志羿 / 向羽</span>
                        <span class="court-sidebar__vs-gap" aria-hidden="true">vs</span>
                        <span class="court-sidebar__names court-sidebar__names--away"
                            data-live-text="badminton_match3_b">严雅伦 / 贾荷宇</span>
                    </div>
                    <footer class="court-sidebar__match-foot">
                        <!-- <div class="match_score_default" data-live-text="badminton_match3_default"></div> -->
                        <div class="match_score" data-live-text="badminton_match3_score1">21:18</div>
                        <div class="match_score" data-live-text="badminton_match3_score2">21:18</div>
                        <div class="match_score" data-live-text-opt data-live-text="badminton_match3_score3" hidden>
                        </div>
                    </footer>
                </article>
            </div>
        </div>
    </div>
</body>

</html>
