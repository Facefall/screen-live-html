<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>羽毛球直播大屏2222</title>
    <link rel="stylesheet" href="/badminton_v2.css" />
</head>

<body class="badminton-page">
    <div class="root">
        <div>
            <!-- 文案与侧栏底图以 config/display_v2.json 为准；以下为服务端不可用时的占位 -->
            <div class="court-sidebar__matches" data-live-bg="badminton_img_sidebar">
                <article class="court-sidebar__match court-sidebar__match-first" aria-label="赛事预告第一场">
                    <header class="court-sidebar__match-head">
                        <div>
                            <span class="court-sidebar__meta" data-live-text="badminton_match1_meta">—</span>
                            <span class="match_time" data-live-text="badminton_match1_match_time">—</span>
                        </div>
                    </header>
                    <div class="court-sidebar__pair-names">
                        <span class="court-sidebar__names court-sidebar__names--home"
                            data-live-text="badminton_match1_a">—</span>
                        <span class="court-sidebar__vs-gap" aria-hidden="true"> vs </span>
                        <span class="court-sidebar__names court-sidebar__names--away"
                            data-live-text="badminton_match1_b">—</span>
                    </div>
                    <footer class="court-sidebar__match-foot">
                        <!-- <div class="match_score_default" data-live-text="badminton_match1_default"></div> -->
                        <div class="match_score" data-live-text="badminton_match1_score1">—</div>
                        <div class="match_score match_score_match1" data-live-text="badminton_match1_score2">—</div>
                        <div class="match_score" data-live-text-opt data-live-text="badminton_match1_score3"></div>
                    </footer>
                </article>

                <article class="court-sidebar__match court-sidebar__match-second" aria-label="赛事预告第二场">
                    <header class="court-sidebar__match-head">
                        <div>
                            <span class="court-sidebar__meta" data-live-text="badminton_match2_meta">—</span>
                            <span class="match_time" data-live-text="badminton_match2_match_time">—</span>
                        </div>
                    </header>
                    <div class="court-sidebar__pair-names">
                        <span class="court-sidebar__names court-sidebar__names--home"
                            data-live-text="badminton_match2_a">—</span>
                        <span class="court-sidebar__vs-gap" aria-hidden="true">vs
                        </span>
                        <span class="court-sidebar__names court-sidebar__names--away"
                            data-live-text="badminton_match2_b">—</span>
                    </div>
                    <footer class="court-sidebar__match-foot">
                        <!-- <div class="match_score_default" data-live-text="badminton_match2_default"></div> -->
                        <div class="match_score" data-live-text="badminton_match2_score1">—</div>
                        <div class="match_score match_score_match1" data-live-text="badminton_match2_score2">—</div>
                        <div class="match_score" data-live-text-opt data-live-text="badminton_match2_score3" hidden>
                        </div>
                    </footer>
                </article>

                <article class="court-sidebar__match court-sidebar__match-third" aria-label="赛事预告第三场">
                    <header class="court-sidebar__match-head">
                        <div>
                            <span class="court-sidebar__meta" data-live-text="badminton_match3_meta">—</span>
                            <span class="match_time" data-live-text="badminton_match3_match_time">—</span>
                        </div>
                    </header>
                    <div class="court-sidebar__pair-names">
                        <span class="court-sidebar__names court-sidebar__names--home"
                            data-live-text="badminton_match3_a">—</span>
                        <span class="court-sidebar__vs-gap" aria-hidden="true">vs</span>
                        <span class="court-sidebar__names court-sidebar__names--away"
                            data-live-text="badminton_match3_b">—</span>
                    </div>
                    <footer class="court-sidebar__match-foot">
                        <!-- <div class="match_score_default" data-live-text="badminton_match3_default"></div> -->
                        <div class="match_score" data-live-text="badminton_match3_score1">—</div>
                        <div class="match_score match_score_match1" data-live-text="badminton_match3_score2">—</div>
                        <div class="match_score" data-live-text-opt data-live-text="badminton_match3_score3" hidden>
                        </div>
                    </footer>
                </article>
            </div>
        </div>
    </div>
    <script type="module" src="/badminton_v2.js"></script>
</body>

</html>
